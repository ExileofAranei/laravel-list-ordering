name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independence-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    name: Independence gates

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: No references to consumer application code
        run: '! grep -rn ''App\\'' src/ tests/'

      - name: No hard-ban consumer vocabulary (tier 1)
        run: '! grep -rniE ''block|canvas|slot|tgs|accordion|placement|categor|article|news|nested set'' src/ tests/'

      - name: No unfiltered hierarchy vocabulary (tier 2)
        run: |
          # Tier 2 words are ambiguous: "parent"/"child" also name a plain PHP language
          # construct (parent::method()), and "tree"/"node"/"hierarch"/"ancestor"/"descendant"
          # also appear in legitimate LSP/covariance discussion. Exceptions are named here,
          # not silently dropped from the word list.
          MATCHES=$(grep -rniE 'parent|child|tree|node|hierarch|ancestor|descendant' src/ tests/ || true)
          FILTERED=$(printf '%s\n' "$MATCHES" | grep -viE 'parent::|LSP|Liskov|covarian' || true)
          if [ -n "$FILTERED" ]; then
            echo "$FILTERED"
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5, 8.4, 8.3]
        laravel: [13.*, 12.*]
        # prefer-lowest resolves pestphp/pest down to its composer.json floor
        # ("pestphp/pest": "^4.2"). Do not lower that floor to ^4.0 without
        # re-running `composer update --prefer-lowest` on both matrix legs
        # (testbench 10.*/laravel 12.*, testbench 11.*/laravel 13.*) first:
        # pest 4.0.0/4.1.0's PHPUnit ErrorHandler integration conflicts with
        # orchestra/testbench-core, and this job only catches that under
        # prefer-lowest, not prefer-stable.
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  # Four standalone jobs, not a `db` matrix with one shared `services:`
  # block: GitHub Actions services are declared per job, not per matrix
  # value, so a matrix leg here would start ALL THREE database services on
  # EVERY leg regardless of which one it actually tests — including the
  # sqlite leg, which needs none of them. Four legs each booting three heavy
  # database containers (12 total, in parallel) reliably failed at
  # "Initialize containers" in practice; each job below starts only the one
  # service (if any) it actually needs.
  collation-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    name: Collation - sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci

  collation-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    name: Collation - mysql

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ''

  collation-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    name: Collation - mariadb

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: testing
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ''

  collation-pgsql:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    name: Collation - pgsql

    services:
      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
