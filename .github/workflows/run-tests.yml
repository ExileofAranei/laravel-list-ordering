name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independence-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    name: Independence gates

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: No references to consumer application code
        run: '! grep -rn ''App\\'' src/ tests/'

      - name: No hard-ban consumer vocabulary (tier 1)
        run: '! grep -rniE ''block|canvas|slot|tgs|accordion|placement|categor|article|news|nested set'' src/ tests/'

      - name: No unfiltered hierarchy vocabulary (tier 2)
        run: |
          # Tier 2 words are ambiguous: "parent"/"child" also name a plain PHP language
          # construct (parent::method()), and "tree"/"node"/"hierarch"/"ancestor"/"descendant"
          # also appear in legitimate LSP/covariance discussion. Exceptions are named here,
          # not silently dropped from the word list.
          MATCHES=$(grep -rniE 'parent|child|tree|node|hierarch|ancestor|descendant' src/ tests/ || true)
          FILTERED=$(printf '%s\n' "$MATCHES" | grep -viE 'parent::|LSP|Liskov|covarian' || true)
          if [ -n "$FILTERED" ]; then
            echo "$FILTERED"
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5, 8.4, 8.3]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
